<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📚 Library Management System</h1>
        <p>College Library Dashboard</p>
    </header>

    <nav>
        <button onclick="showSection('dashboard')">Dashboard</button>
        <button onclick="showSection('books')">Books</button>
        <button onclick="showSection('members')">Members</button>
        <button onclick="showSection('issue')">Issue / Return</button>
        <button onclick="showSection('transactions')">Transactions</button>
    </nav>

    <main>

        <!-- Dashboard -->
        <section id="dashboard" class="section active">
            <h2>Dashboard</h2>

            <div class="stats">

                <div class="card">
                    <h3>Total Books</h3>
                    <p id="totalBooks">0</p>
                </div>

                <div class="card">
                    <h3>Available Books</h3>
                    <p id="availableBooks">0</p>
                </div>

                <div class="card">
                    <h3>Issued Books</h3>
                    <p id="issuedBooks">0</p>
                </div>

                <div class="card">
                    <h3>Total Members</h3>
                    <p id="totalMembers">0</p>
                </div>

                <div class="card">
                    <h3>Overdue Books</h3>
                    <p id="overdueBooks">0</p>
                </div>

                <div class="card">
                    <h3>Transactions</h3>
                    <p id="totalTransactions">0</p>
                </div>

            </div>
        </section>


        <!-- Books -->
        <section id="books" class="section">

            <h2>Book Management</h2>

            <form id="bookForm">

                <input
                    type="text"
                    id="bookTitle"
                    placeholder="Book Title"
                    required
                >

                <input
                    type="text"
                    id="bookAuthor"
                    placeholder="Author"
                    required
                >

                <input
                    type="text"
                    id="bookISBN"
                    placeholder="ISBN"
                >

                <input
                    type="text"
                    id="bookCategory"
                    placeholder="Category"
                >

                <input
                    type="number"
                    id="bookQuantity"
                    placeholder="Quantity"
                    min="1"
                    required
                >

                <button type="submit">Add Book</button>

            </form>

            <input
                type="text"
                id="bookSearch"
                placeholder="Search books..."
                oninput="searchBooks()"
            >

            <div id="booksList"></div>

        </section>


        <!-- Members -->
        <section id="members" class="section">

            <h2>Member Management</h2>

            <form id="memberForm">

                <input
                    type="text"
                    id="memberName"
                    placeholder="Member Name"
                    required
                >

                <input
                    type="email"
                    id="memberEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="text"
                    id="memberPhone"
                    placeholder="Phone"
                >

                <button type="submit">Register Member</button>

            </form>

            <input
                type="text"
                id="memberSearch"
                placeholder="Search members..."
                oninput="searchMembers()"
            >

            <div id="membersList"></div>

        </section>


        <!-- Issue / Return -->
        <section id="issue" class="section">

            <h2>Issue / Return Books</h2>

            <form id="issueForm">

                <input
                    type="number"
                    id="issueBookId"
                    placeholder="Book ID"
                    required
                >

                <input
                    type="number"
                    id="issueMemberId"
                    placeholder="Member ID"
                    required
                >

                <label>Due Date</label>

                <input
                    type="date"
                    id="dueDate"
                    required
                >

                <button type="submit">Issue Book</button>

            </form>

            <div id="issueMessage"></div>

            <h3>Currently Issued Books</h3>

            <div id="issuedList"></div>

        </section>


        <!-- Transactions -->
        <section id="transactions" class="section">

            <h2>Transaction History</h2>

            <div id="transactionsList"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
