<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 700px;
            padding: 45px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border-radius: 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }

        .pipeline {
            margin-top: 30px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Library Management System</h1>

    <p>
        A DevOps-based Library Management System developed as a
        college Agile Software Development and DevOps case study.
    </p>

    <div class="status">
        ✓ Successfully Deployed
    </div>

    <div class="pipeline">
        <strong>Automated Deployment</strong>

        <p>
            GitHub Actions automatically deploys this website
            whenever changes are pushed to the repository.
        </p>
    </div>

</div>

</body>
</html>
